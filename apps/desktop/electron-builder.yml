# LongMa 桌面端打包配置（electron-builder）
#
# 产物布局要点：
# - out/**：electron-vite 构建产物（main 已把 @fundet/agent-core / @fundet/shared
#   两个 workspace 包打包进 JS，见 electron.vite.config.ts，故排除它们的 node_modules 拷贝）。
# - drizzle/**：SQLite migration SQL。asar 内路径为 resources/app.asar/drizzle，
#   db/client.ts 的 resolveMigrationsFolder 从 out/main 相对解析即可读到（fs 支持 asar）。
# - node_modules：electron-builder 自动收集 dependencies（better-sqlite3 原生模块、
#   drizzle-orm 等 main 进程 external 依赖）。
# - extraResources：apps/pi-bin/ 整目录（pi 二进制 + theme + node_modules，缺一不可）
#   拷到 resources/pi/，host/pi-binary.ts 在打包态按 resourcesPath/pi/<platform>-<arch>/pi 取。

appId: com.longma.app
productName: LongMa
directories:
  output: dist
  buildResources: resources

# 自动更新/发版的更新源：GitHub Releases（latest.yml / latest-mac.yml 随包发布）。
# releaseType 必须显式 release：默认 draft 时两个 job 并发建草稿，GitHub 允许同 tag
# 多个 draft 共存 → 产生两个残缺的草稿 Release；published 受 tag 唯一约束，第二个
# job 会正确复用已有 Release。
publish:
  provider: github
  owner: xiaosen6
  repo: longma
  releaseType: release

# Windows 构建把 electronDist 通过 CLI 指到本机 node_modules/electron/dist。
# macOS 构建不要设 electronDist，让 electron-builder 拉 darwin 包。
# better-sqlite3 v13 是 N-API 预编译，不要走 node-gyp（本机通常没 VS）。
npmRebuild: false

files:
  - out/**
  - drizzle/**
  - package.json
  # agent-core/shared 打进主 bundle，不进 asar；browser-runtime 的运行时闭包
  # （playwright-core/sharp/…，96 包）由 tools/pack-browser-deps.mjs 打平，
  # 经下方 extraResources 落到 resources/node_modules（asar 外，主进程模块
  # 解析向上可及；.node 原生二进制不进 asar 也免去 asarUnpack）
  - "!node_modules/@fundet/agent-core"
  - "!node_modules/@fundet/shared"

asarUnpack:
  - "**/*.node"

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources-browser/node_modules
    to: node_modules
  - from: ../../apps/cua-driver-bin/win32-x64
    to: cua-driver/win32-x64
    filter:
      - '**/*'
  - from: resources/bundled-skills
    to: bundled-skills
    filter:
      - '**/*'
      - '**/.*'

linux:
  category: Utility
  icon: icon.png
  target:
    - dir
    - AppImage
  extraResources:
    - from: ../../apps/pi-bin/linux-x64
      to: pi/linux-x64
    - from: ../../apps/ripgrep-bin/linux-x64
      to: ripgrep-bin/linux-x64

win:
  icon: icon.ico
  target:
    - nsis
  extraResources:
    - from: ../../apps/pi-bin/win32-x64
      to: pi/win32-x64
    - from: ../../apps/ripgrep-bin/win32-x64
      to: ripgrep-bin/win32-x64
    - from: ../../apps/cua-driver-bin/win32-x64
      to: cua-driver/win32-x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: LongMa
  artifactName: LongMa-Setup-${version}-${arch}.exe

mac:
  icon: icon.png
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  extraResources:
    - from: ../../apps/pi-bin/darwin-${arch}
      to: pi/darwin-${arch}
    - from: ../../apps/ripgrep-bin/darwin-${arch}
      to: ripgrep-bin/darwin-${arch}
    - from: ../../apps/cua-driver-bin/darwin-universal
      to: cua-driver/darwin-universal

dmg:
  artifactName: LongMa-${version}-${arch}.dmg
  # 避免走 sips（仅 macOS 有），否则 Linux 交叉打 dmg 会 ENOENT
  backgroundColor: "#f5f5f5"
