[project]
name = "video"
version = "0.1.0"
description = "Conversation-driven video editor skill (local Whisper ASR)"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "openai-whisper",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
    "pyyaml",
    "mediapipe>=1.0.1",
    "opencv-python-headless>=5.0.0.93",
    "rembg>=2.0.69",
    "onnxruntime>=1.24.3",
]

[project.optional-dependencies]
animations = ["manim"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
